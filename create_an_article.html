<!DOCTYPE html>
<html>
<head>
  <title>Login | James the Polymath</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" >
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <center><h2>Login/Sign Up:</h2></center>
  <form id="loginForm">
    <center>
    <label for="username_input"><h2>Username:</h2></label>
    <input type="text" id="username_input" required placeholder="Username" class="login_query">
    <br>
    <label for="password_input"><h2>Password:</h2></label>
    <input type="password" id="password_input" required placeholder="Password" class="login_query"><br>
    <br><br>
    <input type="submit" id="submit_button">
    </center>
  </form>
  <button id="goaway">cacm-query</button>
  <div class="side-block">
    <center><h1 class="slide">Hello User!</h1>
    <p class="slide">Join the great database of knowledge.</p>
    </center>
  </div>
  <script src="script.js"></script>
</body>
</html>
